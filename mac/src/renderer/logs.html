<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Clipr+</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 0; background: #1e1e1e; color: #c0c0c0; margin: 0; font-size: 12px; }
    .section-label { padding: 6px 10px; background: #2a2a2a; color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; }
    #clipboard-list { max-height: 220px; overflow-y: auto; }
    .clip-item { padding: 8px 10px; border-bottom: 1px solid #2a2a2a; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
    .clip-item:hover { background: #2d2d2d; }
    .clip-item.copied { background: #1a3a1a; }
    .clip-dir { font-size: 10px; flex-shrink: 0; padding: 1px 5px; border-radius: 3px; }
    .clip-dir.local { background: #333; color: #8be9fd; }
    .clip-dir.remote { background: #333; color: #ff79c6; }
    .clip-source { color: #888; font-size: 10px; flex-shrink: 0; width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clip-text { color: #e0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .clip-time { color: #555; font-size: 10px; flex-shrink: 0; }
    .clip-empty { padding: 20px 10px; color: #555; text-align: center; }
    #logs-section { border-top: 1px solid #444; }
    #logs { padding: 6px 10px; font-family: 'Menlo', 'Monaco', monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 180px; overflow-y: auto; }
    .ts { color: #666; }
    .msg { color: #69db7c; }
  </style>
</head>
<body>
  <div class="section-label">Clipboard</div>
  <div id="clipboard-list">
    <div class="clip-empty">No items yet</div>
  </div>
  <div id="logs-section">
    <div class="section-label">Logs</div>
    <div id="logs"></div>
  </div>
  <script src="logs.js"></script>
</body>
</html>
