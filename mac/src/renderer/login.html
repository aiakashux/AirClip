<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Clipr+ Login</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background: #1e1e1e; color: #e0e0e0; margin: 0; }
    h2 { margin-top: 0; font-size: 16px; }
    label { display: block; margin-top: 10px; font-size: 13px; }
    input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; background: #2d2d2d; border: 1px solid #444; color: #e0e0e0; border-radius: 4px; }
    .buttons { margin-top: 16px; display: flex; gap: 8px; }
    button { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    #btnLogin { background: #0078d4; color: white; }
    #btnRegister { background: #444; color: white; }
    #status { margin-top: 12px; font-size: 12px; min-height: 18px; }
    .error { color: #ff6b6b; }
    .success { color: #69db7c; }
  </style>
</head>
<body>
  <h2>Clipr+ Login / Register</h2>
  <label>Email<input type="email" id="email" /></label>
  <label>Password<input type="password" id="password" /></label>
  <div class="buttons">
    <button id="btnLogin">Login</button>
    <button id="btnRegister">Register</button>
  </div>
  <div id="status"></div>
  <script src="login.js"></script>
</body>
</html>
