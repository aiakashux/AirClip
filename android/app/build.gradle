plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.airclip.airclip'
    compileSdk 34

    defaultConfig {
        applicationId "com.airclip.airclip"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/INDEX.LIST'
            excludes += '/META-INF/io.netty.versions.properties'
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'

    // HTTP + WebSocket client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // WebSocket server (LAN peer listener)
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Crypto — lazy-sodium (libsodium JNI bindings for Android)
    implementation 'com.goterl:lazysodium-android:5.1.0@aar'
    implementation 'net.java.dev.jna:jna:5.14.0@aar'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Persistence — DataStore for tokens; TODO: migrate to EncryptedDataStore before production
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // EncryptedSharedPreferences — AES-256-GCM keypair persistence via Android Keystore master key
    implementation 'androidx.security:security-crypto:1.0.0'

    // QR code generation (no UI, pure encoding)
    implementation 'com.google.zxing:core:3.5.3'

    // QR code scanning (launches Intent, returns string result)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Coil — display QR bitmap and SVG splash artwork in Compose
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'io.coil-kt:coil-svg:2.6.0'

    testImplementation 'junit:junit:4.13.2'
}
